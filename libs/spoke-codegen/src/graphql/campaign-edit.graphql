fragment EditCampaignData on Campaign {
  id
  title
  description
  dueBy
  isStarted
  isApproved
  isArchived
  isTemplate
  hasSentMessages
  contactsCount
  datawarehouseAvailable
  customFields
  logoImageUrl
  introHtml
  primaryColor
  textingHoursStart
  textingHoursEnd
  isAssignmentLimitedToTeams
  isAutoassignEnabled
  timezone
  teams {
    id
    title
  }
  messagingServiceSid
  editors
  readiness {
    basics
    textingHours
    integration
    contacts
    autoassign
    cannedResponses
    campaignGroups
    interactions
    texters
  }
  contactsFilename
}

query GetEditCampaignData($campaignId: String!) {
  campaign(id: $campaignId) {
    ...EditCampaignData
  }
}

query GetOrganizationDataForCampaignEdit($organizationId: String!) {
  organization(id: $organizationId) {
    id
    name
    uuid
    teams {
      id
      title
    }
    texters: people {
      id
      firstName
      lastName
      displayName
    }
    numbersApiKey
    messagingServices(active: true) {
      edges {
        node {
          name
        }
      }
    }
    campaigns(cursor: { offset: 0, limit: 5000 }) {
      campaigns {
        id
        title
        createdAt
      }
    }
  }
}

query GetCampaignEditJobs($campaignId: String!) {
  campaign(id: $campaignId) {
    id
    pendingJobs {
      id
      jobType
      assigned
      status
      resultMessage
    }
  }
}

mutation deleteJob($campaignId: String!, $id: String!) {
  deleteJob(campaignId: $campaignId, id: $id) {
    id
  }
}

mutation editCampaign($campaignId: String!, $campaign: CampaignInput!) {
  editCampaign(id: $campaignId, campaign: $campaign) {
    ...EditCampaignData
  }
}

query GetCampaignTeams($campaignId: String!) {
  campaign(id: $campaignId) {
    id
    teams {
      id
      title
    }
    isAssignmentLimitedToTeams
  }
}

query GetOrganizationTeamsForCampaignEdit($organizationId: String!) {
  organization(id: $organizationId) {
    id
    teams {
      id
      title
    }
  }
}

mutation EditCampaignTeams($campaignId: String!, $payload: CampaignInput!) {
  editCampaign(id: $campaignId, campaign: $payload) {
    id
    teams {
      id
      title
    }
    isAssignmentLimitedToTeams
  }
}

query FetchCampaignOverlaps($input: FetchCampaignOverlapInput!) {
  fetchCampaignOverlaps(input: $input) {
    campaign {
      id
      title
    }
    overlapCount
    lastActivity
  }
}

mutation DeleteManyCampaignOverlap(
  $organizationId: String!
  $campaignId: String!
  $overlappingCampaignIds: [String]!
) {
  deleteManyCampaignOverlap(
    organizationId: $organizationId
    campaignId: $campaignId
    overlappingCampaignIds: $overlappingCampaignIds
  )
}
